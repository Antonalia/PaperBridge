name: Complete 1.0.2 draft source (manual only)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: paperbridge-source-v1.0.2
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'Antonalia/PaperBridge' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify packaged source and complete draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.2
        run: |
          python .github/test_complete_release_source.py
          python .github/complete_release_source.py
